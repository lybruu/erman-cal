<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Эрман · Календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #1c1c1e; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    max-width: 430px; margin: 0 auto;
  }

  /* ─── Header ─── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 6px; gap: 6px; flex-shrink: 0;
  }
  .header h2 {
    font-size: 18px; font-weight: 700; text-transform: capitalize;
    flex: 1; text-align: center; letter-spacing: -0.3px;
  }
  .nav-btn {
    background: #2c2c2e; border: none; color: #fff;
    border-radius: 50%; width: 34px; height: 34px;
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.15s;
  }
  .nav-btn:active { background: #48484a; }
  .today-btn {
    background: transparent; border: 1.5px solid #ff9f0a; color: #ff9f0a;
    border-radius: 10px; padding: 5px 12px; font-size: 13px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0; font-weight: 600; transition: all 0.15s;
  }
  .today-btn:active { background: #ff9f0a22; }

  /* ─── Weekdays ─── */
  .weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 2px 8px; text-align: center; flex-shrink: 0;
  }
  .weekdays span { font-size: 11px; color: #636366; padding: 3px 0; font-weight: 500; }

  /* ─── Grid ─── */
  .grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 8px; flex-shrink: 0;
  }
  .day {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 2px; cursor: pointer; border-radius: 10px;
    min-height: 46px; position: relative; transition: background 0.1s;
  }
  .day:active { background: #3a3a3c; }
  .day.other-month .day-num { color: #3a3a3c; }
  .day.today .day-num {
    background: #ff9f0a; color: #000;
    border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .day.selected:not(.today) .day-num {
    background: #3a3a3c; border-radius: 50%;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
  }
  .day-num { font-size: 15px; min-width: 30px; text-align: center; line-height: 30px; }
  .dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 26px; margin-top: 1px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; }
  .dot.calendar { background: #ebebf5cc; }
  .dot.erman { background: #ff9f0a; }
  .dot.overdue { background: #ff453a; }

  /* ─── Divider ─── */
  .divider { height: 1px; background: #2c2c2e; margin: 6px 16px; flex-shrink: 0; }

  /* ─── Events panel ─── */
  .events-panel {
    flex: 1; padding: 10px 16px 0; overflow-y: auto;
    padding-bottom: 72px; /* space for FAB */
  }
  .events-date { font-size: 12px; color: #636366; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .event-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 9px 0; border-bottom: 1px solid #2c2c2e;
  }
  .event-item:last-child { border-bottom: none; }
  .event-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .event-content { flex: 1; min-width: 0; }
  .event-title { font-size: 14px; font-weight: 500; }
  .event-time { font-size: 11px; color: #636366; margin-top: 2px; }
  .event-plan { font-size: 11px; color: #ff9f0a; margin-top: 2px; }
  .no-events { color: #636366; font-size: 13px; padding: 16px 0; text-align: center; }

  /* ─── Floating refresh button (empty state) ─── */
  .refresh-hint {
    display: none; flex-direction: column; align-items: center;
    padding: 24px 20px; gap: 12px;
  }
  .refresh-hint.visible { display: flex; }
  .refresh-hint p { font-size: 14px; color: #636366; text-align: center; line-height: 1.5; }
  .refresh-btn {
    background: #ff9f0a; color: #000; font-weight: 700;
    border: none; border-radius: 14px; padding: 12px 24px;
    font-size: 15px; cursor: pointer;
  }

  /* ─── FAB (floating action button) ─── */
  .fab {
    position: fixed; bottom: 16px; right: 16px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #ff9f0a; color: #000; font-size: 22px;
    border: none; cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,159,10,0.45);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .fab:active { transform: scale(0.93); box-shadow: 0 2px 10px rgba(255,159,10,0.3); }
  .fab.open { background: #3a3a3c; color: #fff; font-size: 18px; }

  /* ─── Chat overlay ─── */
  .chat-overlay {
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin: 0 auto;
    height: 72vh;
    background: #1c1c1e;
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 200;
    display: flex; flex-direction: column;
    box-shadow: 0 -4px 40px rgba(0,0,0,0.7);
    border-top: 1px solid #2c2c2e;
  }
  .chat-overlay.open { transform: translateY(0); }

  .chat-handle {
    width: 36px; height: 4px; background: #3a3a3c; border-radius: 2px;
    margin: 10px auto 4px; flex-shrink: 0;
  }
  .chat-header {
    display: flex; align-items: center; padding: 8px 16px 10px;
    border-bottom: 1px solid #2c2c2e; flex-shrink: 0;
  }
  .chat-header .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #ff9f0a, #ff6b00);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; margin-right: 10px; flex-shrink: 0;
  }
  .chat-header .info .name { font-size: 15px; font-weight: 600; }
  .chat-header .info .status { font-size: 12px; color: #30d158; }
  .chat-header .close-btn {
    margin-left: auto; background: #2c2c2e; border: none; color: #8e8e93;
    width: 28px; height: 28px; border-radius: 50%; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .chat-messages {
    flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 80%; padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.45; }
  .msg.erman {
    background: #2c2c2e; color: #fff; align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: #ff9f0a; color: #000; align-self: flex-end;
    border-bottom-right-radius: 4px; font-weight: 500;
  }
  .msg.system { background: transparent; color: #636366; font-size: 12px; text-align: center; align-self: center; max-width: 100%; }

  .chat-input-bar {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 16px 16px; flex-shrink: 0;
    border-top: 1px solid #2c2c2e;
  }
  .chat-input-bar input {
    flex: 1; background: #2c2c2e; border: none; border-radius: 20px;
    padding: 10px 16px; color: #fff; font-size: 14px; outline: none;
    font-family: inherit;
  }
  .chat-input-bar input::placeholder { color: #636366; }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%; background: #ff9f0a;
    border: none; color: #000; font-size: 18px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; transition: background 0.15s;
  }
  .send-btn:active { background: #e08e00; }
  .send-btn:disabled { background: #3a3a3c; color: #636366; cursor: default; }

  /* ─── Backdrop ─── */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 150; opacity: 0; pointer-events: none;
    transition: opacity 0.32s;
  }
  .backdrop.visible { opacity: 1; pointer-events: all; }
</style>
</head>
<body>

<!-- Calendar UI -->
<div class="header">
  <button class="nav-btn" onclick="prevMonth()">‹</button>
  <h2 id="month-label">…</h2>
  <button class="nav-btn" onclick="nextMonth()">›</button>
  <button class="today-btn" onclick="goToday()">Сегодня</button>
</div>

<div class="weekdays">
  <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span>
  <span>Пт</span><span>Сб</span><span>Вс</span>
</div>
<div class="grid" id="grid"></div>
<div class="divider"></div>

<div class="events-panel" id="events-panel">
  <!-- Refresh hint shown when no data -->
  <div class="refresh-hint" id="refresh-hint">
    <p>Нет актуальных данных.<br>Нажми чтобы Эрман загрузил твой календарь.</p>
    <button class="refresh-btn" onclick="requestRefresh()">🔄 Загрузить события</button>
  </div>
</div>

<!-- FAB button -->
<button class="fab" id="fab" onclick="toggleChat()" title="Написать Эрману">💬</button>

<!-- Backdrop -->
<div class="backdrop" id="backdrop" onclick="closeChat()"></div>

<!-- Chat overlay -->
<div class="chat-overlay" id="chat-overlay">
  <div class="chat-handle"></div>
  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="info">
      <div class="name">Эрман</div>
      <div class="status">● онлайн</div>
    </div>
    <button class="close-btn" onclick="closeChat()">×</button>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="msg erman">Привет! Могу добавить событие, напоминание или ответить на вопрос.</div>
    <div class="msg system">Ответ придёт в чат Telegram</div>
  </div>
  <div class="chat-input-bar">
    <input type="text" id="chat-input" placeholder="Напиши Эрману…"
      onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" id="send-btn" onclick="sendMsg()">↑</button>
  </div>
</div>

<script>
// ── Data loading ───────────────────────────────────────────────────────
let EVENTS = [];
let TODAY = new Date().toISOString().slice(0, 10);
let hasData = false;

function loadData() {
  try {
    const hash = window.location.hash.slice(1);
    if (!hash) return;
    const b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
    // Add padding
    const pad = b64.length % 4;
    const padded = pad ? b64 + '='.repeat(4 - pad) : b64;
    const json = decodeURIComponent(escape(atob(padded)));
    const data = JSON.parse(json);
    EVENTS = data.events || [];
    TODAY = data.today || TODAY;
    hasData = true;
  } catch (e) {
    console.warn('loadData:', e);
  }
}

// ── Telegram WebApp ────────────────────────────────────────────────────
const twa = window.Telegram && window.Telegram.WebApp;
if (twa) {
  twa.ready();
  twa.expand();
  twa.BackButton.show();
  twa.BackButton.onClick(() => twa.close());
}

// ── Calendar state ─────────────────────────────────────────────────────
let curYear, curMonth, selDate;

function init() {
  loadData();
  const t = new Date(TODAY + 'T12:00:00');
  curYear = t.getFullYear();
  curMonth = t.getMonth();
  selDate = TODAY;

  if (!hasData) {
    document.getElementById('refresh-hint').classList.add('visible');
  }
  render();
}

// ── Helpers ────────────────────────────────────────────────────────────
const MONTHS = ['январь','февраль','март','апрель','май','июнь',
                'июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MSHORT = ['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const DAYS   = ['вс','пн','вт','ср','чт','пт','сб'];

function iso(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function evFor(date) { return EVENTS.filter(e => e.date === date); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Render ─────────────────────────────────────────────────────────────
function render() {
  document.getElementById('month-label').textContent = MONTHS[curMonth] + ' ' + curYear;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const first = new Date(curYear, curMonth, 1);
  let start = first.getDay();
  start = start === 0 ? 6 : start - 1;

  const dim  = new Date(curYear, curMonth + 1, 0).getDate();
  const dimp = new Date(curYear, curMonth, 0).getDate();

  for (let i = start - 1; i >= 0; i--) {
    const pm = curMonth === 0 ? 11 : curMonth - 1;
    const py = curMonth === 0 ? curYear - 1 : curYear;
    grid.appendChild(makeDay(dimp - i, iso(py, pm + 1, dimp - i), true));
  }
  for (let d = 1; d <= dim; d++) {
    grid.appendChild(makeDay(d, iso(curYear, curMonth + 1, d), false));
  }
  const total = start + dim;
  const rem = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= rem; d++) {
    const nm = curMonth === 11 ? 0 : curMonth + 1;
    const ny = curMonth === 11 ? curYear + 1 : curYear;
    grid.appendChild(makeDay(d, iso(ny, nm + 1, d), true));
  }

  renderEvents(selDate);
}

function makeDay(num, dateStr, other) {
  const div = document.createElement('div');
  div.className = 'day' + (other ? ' other-month' : '') +
    (dateStr === TODAY ? ' today' : '') +
    (dateStr === selDate ? ' selected' : '');
  div.onclick = () => { selDate = dateStr; render(); };

  const n = document.createElement('div');
  n.className = 'day-num'; n.textContent = num;
  div.appendChild(n);

  const evs = evFor(dateStr);
  if (evs.length) {
    const dots = document.createElement('div');
    dots.className = 'dots';
    evs.slice(0, 3).forEach(e => {
      const dot = document.createElement('div');
      dot.className = 'dot ' + (e.overdue ? 'overdue' : e.source === 'erman' ? 'erman' : 'calendar');
      dots.appendChild(dot);
    });
    div.appendChild(dots);
  }
  return div;
}

function renderEvents(dateStr) {
  const panel = document.getElementById('events-panel');
  if (!hasData) return; // keep refresh hint

  const evs = evFor(dateStr);
  const d = new Date(dateStr + 'T12:00:00');
  const label = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MSHORT[d.getMonth() + 1];

  let html = `<div class="events-date">${label}</div>`;
  if (!evs.length) {
    html += `<div class="no-events">Событий нет 🗓<br><span style="font-size:11px;color:#ff9f0a">Нажми 💬 чтобы добавить</span></div>`;
  } else {
    const sorted = [...evs].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
    sorted.forEach(e => {
      const color = e.overdue ? '#ff453a' : e.source === 'erman' ? '#ff9f0a' : '#ebebf5cc';
      html += `<div class="event-item">
        <div class="event-dot" style="background:${color}"></div>
        <div class="event-content">
          <div class="event-title">${esc(e.title)}</div>
          ${e.time ? `<div class="event-time">${e.time}</div>` : ''}
          ${e.plan ? `<div class="event-plan">📋 ${esc(e.plan)}</div>` : ''}
        </div>
      </div>`;
    });
  }
  panel.innerHTML = html;
}

// ── Navigation ─────────────────────────────────────────────────────────
function prevMonth() {
  curMonth--; if (curMonth < 0) { curMonth = 11; curYear--; } render();
}
function nextMonth() {
  curMonth++; if (curMonth > 11) { curMonth = 0; curYear++; } render();
}
function goToday() {
  const t = new Date(TODAY + 'T12:00:00');
  curYear = t.getFullYear(); curMonth = t.getMonth(); selDate = TODAY; render();
}

// ── Refresh (empty state) ──────────────────────────────────────────────
function requestRefresh() {
  if (twa) {
    twa.sendData(JSON.stringify({ type: 'cal_request' }));
  } else {
    alert('Открой через Telegram чтобы загрузить данные.');
  }
}

// ── Chat overlay ───────────────────────────────────────────────────────
function toggleChat() {
  const overlay = document.getElementById('chat-overlay');
  if (overlay.classList.contains('open')) {
    closeChat();
  } else {
    openChat();
  }
}

function openChat() {
  document.getElementById('chat-overlay').classList.add('open');
  document.getElementById('backdrop').classList.add('visible');
  document.getElementById('fab').classList.add('open');
  document.getElementById('fab').textContent = '×';
  setTimeout(() => document.getElementById('chat-input').focus(), 350);
}

function closeChat() {
  document.getElementById('chat-overlay').classList.remove('open');
  document.getElementById('backdrop').classList.remove('visible');
  document.getElementById('fab').classList.remove('open');
  document.getElementById('fab').textContent = '💬';
  document.getElementById('chat-input').blur();
}

function addMsg(text, side) {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg ' + side;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, 'user');
  input.value = '';

  // Add "sending" note
  const note = document.createElement('div');
  note.className = 'msg system';
  note.textContent = 'Отправляю Эрману…';
  document.getElementById('chat-messages').appendChild(note);
  document.getElementById('chat-messages').scrollTop = 9999;

  if (twa) {
    // Small delay so user sees their message before app closes
    setTimeout(() => {
      twa.sendData(JSON.stringify({ type: 'message', text: text }));
    }, 400);
  } else {
    note.textContent = 'Открой через Telegram';
  }
}

// ── Boot ───────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
