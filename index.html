<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Эрман · Календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1c1c1e; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    max-width: 430px; margin: 0 auto;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 8px; gap: 8px;
  }
  .header h2 { font-size: 20px; font-weight: 700; text-transform: capitalize; flex: 1; text-align: center; }
  .nav-btn {
    background: #2c2c2e; border: none; color: #fff;
    border-radius: 50%; width: 36px; height: 36px;
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .today-btn {
    background: #2c2c2e; border: none; color: #ff9f0a;
    border-radius: 12px; padding: 6px 14px; font-size: 14px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 4px 8px; text-align: center;
  }
  .weekdays span { font-size: 12px; color: #8e8e93; padding: 4px 0; }
  .grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 8px; flex: 0;
  }
  .day {
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 2px; cursor: pointer; border-radius: 12px;
    min-height: 52px; position: relative;
  }
  .day:active { background: #3a3a3c; }
  .day.other-month .day-num { color: #48484a; }
  .day.today .day-num {
    background: #ff9f0a; color: #000;
    border-radius: 50%; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .day.selected:not(.today) .day-num {
    background: #3a3a3c;
    border-radius: 50%; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
  }
  .day-num { font-size: 16px; line-height: 32px; min-width: 32px; text-align: center; }
  .dots { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; justify-content: center; max-width: 28px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot.calendar { background: #fff; }
  .dot.erman { background: #ff9f0a; }
  .dot.overdue { background: #ff453a; }
  .divider { height: 1px; background: #2c2c2e; margin: 8px 16px; }
  .events-panel { flex: 1; padding: 12px 16px; overflow-y: auto; padding-bottom: 80px; }
  .events-date { font-size: 13px; color: #8e8e93; margin-bottom: 10px; font-weight: 500; }
  .event-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0; border-bottom: 1px solid #2c2c2e;
  }
  .event-item:last-child { border-bottom: none; }
  .event-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .event-content { flex: 1; min-width: 0; }
  .event-title { font-size: 15px; font-weight: 500; }
  .event-time { font-size: 12px; color: #8e8e93; margin-top: 2px; }
  .event-plan { font-size: 11px; color: #ff9f0a; margin-top: 2px; }
  .no-events { color: #8e8e93; font-size: 14px; padding: 20px 0; text-align: center; }
  .chat-btn {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 398px;
    background: #ff9f0a; color: #000; font-weight: 600;
    border: none; border-radius: 14px; padding: 14px;
    margin: 12px 16px; font-size: 15px; cursor: pointer;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  }
  .loading { color: #8e8e93; text-align: center; padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <button class="nav-btn" onclick="prevMonth()">←</button>
  <h2 id="month-label">загрузка…</h2>
  <button class="nav-btn" onclick="nextMonth()">→</button>
  <button class="today-btn" onclick="goToday()">Сегодня</button>
</div>

<div class="weekdays">
  <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span>
  <span>Пт</span><span>Сб</span><span>Вс</span>
</div>

<div class="grid" id="grid"></div>
<div class="divider"></div>
<div class="events-panel" id="events-panel"><div class="loading">…</div></div>
<button class="chat-btn" onclick="chatWithErman()">Chat with Erman</button>

<script>
// ── Data loading ───────────────────────────────────────────────────────
// Data comes via URL hash: #BASE64(JSON)
// Fallback: demo data for direct browser preview

let EVENTS = [];
let TODAY = new Date().toISOString().slice(0,10);

function loadData() {
  try {
    const hash = window.location.hash.slice(1); // remove #
    if (hash) {
      // URL-safe base64 → standard base64
      const b64 = hash.replace(/-/g,'+').replace(/_/g,'/');
      const json = decodeURIComponent(escape(atob(b64)));
      const data = JSON.parse(json);
      EVENTS = data.events || [];
      TODAY = data.today || TODAY;
    }
  } catch(e) {
    console.warn('loadData failed:', e);
    // keep empty EVENTS — show empty calendar
  }
}

// ── Telegram WebApp ────────────────────────────────────────────────────
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  Telegram.WebApp.BackButton.show();
  Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
}

// ── Calendar state ─────────────────────────────────────────────────────
let currentYear, currentMonth, selectedDate;

function init() {
  loadData();
  const t = new Date(TODAY + 'T12:00:00');
  currentYear = t.getFullYear();
  currentMonth = t.getMonth();
  selectedDate = TODAY;
  render();
}

// ── Helpers ────────────────────────────────────────────────────────────
const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь',
                   'июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_SHORT = ['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const DAYS_RU = ['вс','пн','вт','ср','чт','пт','сб'];

function eventsForDate(dateStr) {
  return EVENTS.filter(e => e.date === dateStr);
}

// ── Render ─────────────────────────────────────────────────────────────
function render() {
  document.getElementById('month-label').textContent =
    MONTHS_RU[currentMonth] + ' ' + currentYear;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const first = new Date(currentYear, currentMonth, 1);
  let startDay = first.getDay();
  startDay = startDay === 0 ? 6 : startDay - 1; // Mon=0

  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const daysInPrev  = new Date(currentYear, currentMonth, 0).getDate();

  // Prev month padding
  for (let i = startDay - 1; i >= 0; i--) {
    const d = daysInPrev - i;
    const prevMonth = currentMonth === 0 ? 11 : currentMonth - 1;
    const prevYear  = currentMonth === 0 ? currentYear - 1 : currentYear;
    const dateStr = iso(prevYear, prevMonth + 1, d);
    grid.appendChild(makeDay(d, dateStr, true));
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = iso(currentYear, currentMonth + 1, d);
    grid.appendChild(makeDay(d, dateStr, false));
  }

  // Next month padding (fill to complete the last row)
  const total = startDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= remaining; d++) {
    const nextMonth = currentMonth === 11 ? 0 : currentMonth + 1;
    const nextYear  = currentMonth === 11 ? currentYear + 1 : currentYear;
    const dateStr = iso(nextYear, nextMonth + 1, d);
    grid.appendChild(makeDay(d, dateStr, true));
  }

  renderEvents(selectedDate);
}

function iso(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function makeDay(num, dateStr, otherMonth) {
  const div = document.createElement('div');
  div.className = 'day'
    + (otherMonth ? ' other-month' : '')
    + (dateStr === TODAY ? ' today' : '')
    + (dateStr === selectedDate ? ' selected' : '');
  div.onclick = () => { selectedDate = dateStr; render(); };

  const numEl = document.createElement('div');
  numEl.className = 'day-num';
  numEl.textContent = num;
  div.appendChild(numEl);

  const evs = eventsForDate(dateStr);
  if (evs.length > 0) {
    const dots = document.createElement('div');
    dots.className = 'dots';
    evs.slice(0, 3).forEach(e => {
      const dot = document.createElement('div');
      dot.className = 'dot ' + (e.overdue ? 'overdue' : e.source === 'erman' ? 'erman' : 'calendar');
      dots.appendChild(dot);
    });
    div.appendChild(dots);
  }
  return div;
}

function renderEvents(dateStr) {
  const panel = document.getElementById('events-panel');
  const evs = eventsForDate(dateStr);

  const d = new Date(dateStr + 'T12:00:00');
  const dateLabel = DAYS_RU[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()+1];

  let html = `<div class="events-date">${dateLabel}</div>`;

  if (evs.length === 0) {
    html += `<div class="no-events">Событий нет<br>
      <span style="font-size:12px;color:#ff9f0a">Скажи Эрману чтобы добавил</span></div>`;
  } else {
    // Sort by time
    const sorted = [...evs].sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
    sorted.forEach(e => {
      const color = e.overdue ? '#ff453a' : e.source === 'erman' ? '#ff9f0a' : '#ffffff';
      const time = e.time ? `<div class="event-time">${e.time}</div>` : '';
      const plan = e.plan ? `<div class="event-plan">📋 ${e.plan}</div>` : '';
      html += `<div class="event-item">
        <div class="event-dot" style="background:${color}"></div>
        <div class="event-content">
          <div class="event-title">${escHtml(e.title)}</div>
          ${time}${plan}
        </div>
      </div>`;
    });
  }
  panel.innerHTML = html;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Navigation ─────────────────────────────────────────────────────────
function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
}
function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
}
function goToday() {
  const t = new Date(TODAY + 'T12:00:00');
  currentYear = t.getFullYear();
  currentMonth = t.getMonth();
  selectedDate = TODAY;
  render();
}
function chatWithErman() {
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.close();
  }
}

// ── Boot ───────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
