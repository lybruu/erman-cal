<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Эрман</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #1c1c1e;
  --bg2: #2c2c2e;
  --bg3: #3a3a3c;
  --text: #ffffff;
  --sub: #8e8e93;
  --dim: #48484a;
  --accent: #ff9f0a;
  --danger: #ff453a;
  --green: #30d158;
  --radius: 14px;
}

html, body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  height: 100%; overflow: hidden;
  max-width: 430px; margin: 0 auto;
}

/* ════════════════════════════════
   SCENES — two full-screen pages
   ════════════════════════════════ */
.scene-wrap {
  display: flex; width: 200%; height: 100vh;
  transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}
.scene-wrap.show-chat { transform: translateX(-50%); }

.scene {
  width: 50%; height: 100vh;
  display: flex; flex-direction: column; overflow: hidden;
  flex-shrink: 0;
}

/* ════════════════════
   SCENE 1 — CALENDAR
   ════════════════════ */
#s-calendar {
  background: var(--bg);
}

.cal-header {
  display: flex; align-items: center; gap: 6px;
  padding: 14px 14px 6px; flex-shrink: 0;
}
.cal-header h2 {
  flex: 1; text-align: center; font-size: 17px;
  font-weight: 700; text-transform: capitalize; letter-spacing: -0.3px;
}
.nav-btn {
  background: var(--bg2); border: none; color: var(--text);
  border-radius: 50%; width: 32px; height: 32px; font-size: 17px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-btn:active { background: var(--bg3); }
.today-btn {
  background: transparent; border: 1.5px solid var(--accent); color: var(--accent);
  border-radius: 10px; padding: 4px 11px; font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.today-btn:active { background: #ff9f0a22; }

.weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  padding: 2px 8px; text-align: center; flex-shrink: 0;
}
.weekdays span { font-size: 11px; color: #636366; padding: 3px 0; font-weight: 500; }

.grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  padding: 0 8px; flex-shrink: 0;
}
.day {
  display: flex; flex-direction: column; align-items: center;
  padding: 4px 2px; cursor: pointer; border-radius: 10px; min-height: 44px;
  transition: background .1s;
}
.day:active { background: var(--bg3); }
.day.other-month .day-num { color: #3a3a3c; }
.day.today .day-num {
  background: var(--accent); color: #000; border-radius: 50%;
  width: 29px; height: 29px; display: flex; align-items: center;
  justify-content: center; font-weight: 700;
}
.day.selected:not(.today) .day-num {
  background: var(--bg3); border-radius: 50%;
  width: 29px; height: 29px; display: flex; align-items: center; justify-content: center;
}
.day-num { font-size: 15px; min-width: 29px; text-align: center; line-height: 29px; }
.dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 26px; margin-top: 2px; }
.dot { width: 4px; height: 4px; border-radius: 50%; }
.dot.calendar { background: #ebebf5cc; }
.dot.erman { background: var(--accent); }
.dot.overdue { background: var(--danger); }

.divider { height: 1px; background: var(--bg2); margin: 6px 14px; flex-shrink: 0; }

.events-area {
  flex: 1; overflow-y: auto; padding: 8px 14px 0;
}
.events-date { font-size: 11px; color: #636366; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.event-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 0; border-bottom: 1px solid var(--bg2);
}
.event-item:last-child { border-bottom: none; }
.event-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.event-content { flex: 1; min-width: 0; }
.event-title { font-size: 14px; font-weight: 500; }
.event-time { font-size: 11px; color: var(--sub); margin-top: 2px; }
.event-plan { font-size: 11px; color: var(--accent); margin-top: 2px; }
.no-events { color: #636366; font-size: 13px; padding: 12px 0; text-align: center; }

/* Empty-state refresh */
.empty-state {
  display: none; flex-direction: column; align-items: center;
  padding: 24px 20px; gap: 14px; text-align: center;
}
.empty-state.show { display: flex; }
.empty-state p { font-size: 14px; color: var(--sub); line-height: 1.5; }
.refresh-btn {
  background: var(--accent); color: #000; font-weight: 700; border: none;
  border-radius: var(--radius); padding: 11px 22px; font-size: 14px; cursor: pointer;
}

/* Chat FAB */
.fab {
  position: absolute; bottom: 16px; right: 14px;
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--accent); color: #000; font-size: 22px;
  border: none; cursor: pointer;
  box-shadow: 0 4px 18px rgba(255,159,10,.5);
  display: flex; align-items: center; justify-content: center;
  transition: transform .18s, box-shadow .18s;
  z-index: 10;
}
.fab:active { transform: scale(.92); box-shadow: 0 2px 8px rgba(255,159,10,.3); }

/* ════════════════════
   SCENE 2 — CHAT
   ════════════════════ */
#s-chat {
  background: var(--bg);
  position: relative;
}

.chat-nav {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 10px; border-bottom: 1px solid var(--bg2); flex-shrink: 0;
  background: var(--bg);
}
.back-btn {
  background: none; border: none; color: var(--accent); font-size: 16px;
  cursor: pointer; padding: 4px 6px 4px 0; display: flex; align-items: center; gap: 4px;
  font-weight: 500; white-space: nowrap;
}
.back-btn:active { opacity: .6; }
.chat-nav .avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #ff6b00);
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.chat-nav .info .name { font-size: 15px; font-weight: 600; }
.chat-nav .info .status { font-size: 11px; color: var(--green); }

.chat-msgs {
  flex: 1; overflow-y: auto;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 7px;
  background: var(--bg);
}

.bubble {
  max-width: 78%; padding: 9px 13px; border-radius: 18px;
  font-size: 14px; line-height: 1.45; word-break: break-word;
}
.bubble.bot {
  background: var(--bg2); color: var(--text);
  align-self: flex-start; border-bottom-left-radius: 5px;
}
.bubble.user {
  background: var(--accent); color: #000; font-weight: 500;
  align-self: flex-end; border-bottom-right-radius: 5px;
}
.bubble.system {
  background: none; color: #636366; font-size: 12px;
  align-self: center; max-width: 100%; text-align: center;
  padding: 2px 8px;
}
.bubble.typing { opacity: .6; }

.chat-input-row {
  display: flex; gap: 8px; align-items: flex-end;
  padding: 10px 14px 16px; border-top: 1px solid var(--bg2); flex-shrink: 0;
  background: var(--bg);
}
.chat-input-row textarea {
  flex: 1; background: var(--bg2); border: none; border-radius: 18px;
  padding: 9px 14px; color: var(--text); font-size: 14px; outline: none;
  font-family: inherit; resize: none; max-height: 120px; min-height: 38px;
  line-height: 1.4; overflow-y: auto;
}
.chat-input-row textarea::placeholder { color: #636366; }
.send-btn {
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent);
  border: none; color: #000; font-size: 20px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: background .15s;
}
.send-btn:active { background: #e08e00; }
.send-btn:disabled { background: var(--bg3); color: var(--dim); cursor: default; }
</style>
</head>
<body>

<div class="scene-wrap" id="wrap">

  <!-- ══ SCENE 1: CALENDAR ══ -->
  <div class="scene" id="s-calendar">
    <div class="cal-header">
      <button class="nav-btn" onclick="prevMonth()">‹</button>
      <h2 id="month-label">…</h2>
      <button class="nav-btn" onclick="nextMonth()">›</button>
      <button class="today-btn" onclick="goToday()">Сегодня</button>
    </div>

    <div class="weekdays">
      <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span>
      <span>Пт</span><span>Сб</span><span>Вс</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="divider"></div>

    <div class="events-area" id="events-area">
      <div class="empty-state" id="empty-state">
        <p>Нет актуальных данных.<br>Нажми чтобы загрузить события.</p>
        <button class="refresh-btn" onclick="requestRefresh()">🔄 Загрузить события</button>
      </div>
    </div>

    <!-- FAB: open chat -->
    <button class="fab" onclick="showChat()" title="Написать Эрману">💬</button>
  </div>

  <!-- ══ SCENE 2: CHAT ══ -->
  <div class="scene" id="s-chat">
    <div class="chat-nav">
      <button class="back-btn" onclick="showCal()">‹ Назад</button>
      <div class="avatar">🤖</div>
      <div class="info">
        <div class="name">Эрман</div>
        <div class="status" id="chat-status">● онлайн</div>
      </div>
    </div>

    <div class="chat-msgs" id="chat-msgs">
      <div class="bubble bot">Привет! Напиши что добавить, изменить или спроси что угодно.</div>
      <div class="bubble system">Ответ придёт в Telegram-чат</div>
    </div>

    <div class="chat-input-row">
      <textarea id="msg-input" rows="1" placeholder="Сообщение…"
        oninput="autoResize(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}">
      </textarea>
      <button class="send-btn" id="send-btn" onclick="sendMsg()">↑</button>
    </div>
  </div>

</div><!-- /scene-wrap -->

<script>
// ── Data ──────────────────────────────────────────────────────────────
let EVENTS = [], TODAY = new Date().toISOString().slice(0,10), hasData = false;

function loadData() {
  try {
    const hash = window.location.hash.slice(1);
    if (!hash) return;
    const b64 = hash.replace(/-/g,'+').replace(/_/g,'/');
    const pad = b64.length % 4;
    const json = decodeURIComponent(escape(atob(pad ? b64 + '='.repeat(4-pad) : b64)));
    const d = JSON.parse(json);
    EVENTS = d.events || [];
    TODAY  = d.today  || TODAY;
    hasData = true;
  } catch(e) { console.warn('loadData:', e); }
}

// ── Telegram WebApp ───────────────────────────────────────────────────
const twa = window.Telegram && window.Telegram.WebApp;
if (twa) { twa.ready(); twa.expand(); }

// ── Scenes ────────────────────────────────────────────────────────────
let onChat = false;

function showChat() {
  onChat = true;
  document.getElementById('wrap').classList.add('show-chat');
  if (twa) {
    twa.BackButton.show();
    twa.BackButton.onClick(showCal);
  }
  setTimeout(() => document.getElementById('msg-input').focus(), 380);
}

function showCal() {
  onChat = false;
  document.getElementById('wrap').classList.remove('show-chat');
  if (twa) {
    twa.BackButton.hide();
    // Restore close-on-back
    twa.BackButton.onClick(() => twa.close());
  }
}

// ── Calendar helpers ──────────────────────────────────────────────────
const MONTHS = ['январь','февраль','март','апрель','май','июнь',
                'июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MSHORT = ['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const DSHORT = ['вс','пн','вт','ср','чт','пт','сб'];

let curY, curM, selDate;

function iso(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function evFor(date) { return EVENTS.filter(e => e.date === date); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function init() {
  loadData();
  const t = new Date(TODAY + 'T12:00:00');
  curY = t.getFullYear(); curM = t.getMonth(); selDate = TODAY;

  if (!hasData) document.getElementById('empty-state').classList.add('show');
  if (twa) twa.BackButton.onClick(() => twa.close());

  render();
}

function render() {
  document.getElementById('month-label').textContent = MONTHS[curM] + ' ' + curY;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const first = new Date(curY, curM, 1);
  let start = first.getDay();
  start = start === 0 ? 6 : start - 1;

  const dim  = new Date(curY, curM + 1, 0).getDate();
  const dimp = new Date(curY, curM, 0).getDate();

  for (let i = start - 1; i >= 0; i--) {
    const pm = curM === 0 ? 11 : curM - 1;
    const py = curM === 0 ? curY - 1 : curY;
    grid.appendChild(day(dimp - i, iso(py, pm + 1, dimp - i), true));
  }
  for (let d = 1; d <= dim; d++) grid.appendChild(day(d, iso(curY, curM + 1, d), false));

  const total = start + dim, rem = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= rem; d++) {
    const nm = curM === 11 ? 0 : curM + 1;
    const ny = curM === 11 ? curY + 1 : curY;
    grid.appendChild(day(d, iso(ny, nm + 1, d), true));
  }

  if (hasData) renderEvents(selDate);
}

function day(num, dateStr, other) {
  const div = document.createElement('div');
  div.className = 'day' + (other?' other-month':'') +
    (dateStr===TODAY?' today':'') + (dateStr===selDate?' selected':'');
  div.onclick = () => { selDate = dateStr; render(); };
  const n = document.createElement('div'); n.className = 'day-num'; n.textContent = num;
  div.appendChild(n);
  const evs = evFor(dateStr);
  if (evs.length) {
    const dots = document.createElement('div'); dots.className = 'dots';
    evs.slice(0,3).forEach(e => {
      const dot = document.createElement('div');
      dot.className = 'dot '+(e.overdue?'overdue':e.source==='erman'?'erman':'calendar');
      dots.appendChild(dot);
    });
    div.appendChild(dots);
  }
  return div;
}

function renderEvents(dateStr) {
  const area = document.getElementById('events-area');
  const evs = evFor(dateStr);
  const d = new Date(dateStr + 'T12:00:00');
  const label = DSHORT[d.getDay()] + ' ' + d.getDate() + ' ' + MSHORT[d.getMonth()+1];

  let html = `<div class="events-date">${label}</div>`;
  if (!evs.length) {
    html += `<div class="no-events">Событий нет 🗓<br><span style="font-size:11px;color:var(--accent)">Нажми 💬 чтобы добавить</span></div>`;
  } else {
    [...evs].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')).forEach(e => {
      const col = e.overdue ? 'var(--danger)' : e.source==='erman' ? 'var(--accent)' : '#ebebf5cc';
      html += `<div class="event-item">
        <div class="event-dot" style="background:${col}"></div>
        <div class="event-content">
          <div class="event-title">${esc(e.title)}</div>
          ${e.time?`<div class="event-time">${e.time}</div>`:''}
          ${e.plan?`<div class="event-plan">📋 ${esc(e.plan)}</div>`:''}
        </div></div>`;
    });
  }
  area.innerHTML = html;
}

function prevMonth() { curM--; if(curM<0){curM=11;curY--;} render(); }
function nextMonth() { curM++; if(curM>11){curM=0;curY++;} render(); }
function goToday() {
  const t = new Date(TODAY+'T12:00:00');
  curY=t.getFullYear(); curM=t.getMonth(); selDate=TODAY; render();
}

// ── Empty state ───────────────────────────────────────────────────────
function requestRefresh() {
  if (twa) twa.sendData(JSON.stringify({type:'cal_request'}));
  else alert('Открой через Telegram');
}

// ── Chat ──────────────────────────────────────────────────────────────
function addBubble(text, side) {
  const box = document.getElementById('chat-msgs');
  const div = document.createElement('div');
  div.className = 'bubble ' + side;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function sendMsg() {
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if (!text) return;

  inp.value = ''; inp.style.height = '';
  document.getElementById('send-btn').disabled = true;

  addBubble(text, 'user');

  const note = addBubble('Отправляю…', 'system');

  if (twa) {
    setTimeout(() => {
      // sendData closes the mini app — bot processes and replies in TG chat
      twa.sendData(JSON.stringify({type:'message', text}));
    }, 350);
  } else {
    note.textContent = 'Открой через Telegram';
    document.getElementById('send-btn').disabled = false;
  }
}

init();
</script>
</body>
</html>
