<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>erMan</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0f; --bg2: #14141f; --bg3: #1e1e2e;
  --text: #f0f0f5; --sub: #6e6e80; --dim: #2a2a3a;
  --accent: #ff9f0a; --accent2: #ff6b00;
  --danger: #ff453a; --green: #34d399;
  --blue: #38bdf8; --cyan: #22d3ee;
  --glow-accent: rgba(255,159,10,.25);
  --glow-blue: rgba(56,189,248,.2);
}

html, body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  height: 100%; overflow: hidden;
  max-width: 430px; margin: 0 auto;
}

/* ═══ LAYOUT ═══ */
.app { display: flex; flex-direction: column; height: 100%; position: relative; }
.tab-content { flex: 1; overflow: hidden; position: relative; }
.tab-pane {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; overflow: hidden;
  visibility: hidden; z-index: 0;
}
.tab-pane.active { visibility: visible; z-index: 1; }

/* Particle canvas background */
#particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* Tab bar */
.tab-bar {
  display: flex; flex-shrink: 0;
  border-top: 1px solid rgba(255,255,255,.06);
  padding: 8px 0 env(safe-area-inset-bottom, 10px);
  background: rgba(10,10,15,.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  z-index: 10;
}
.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 6px 0; cursor: pointer;
  color: var(--sub); font-size: 10px; font-weight: 500; letter-spacing: .3px;
  border: none; background: none;
  transition: color .2s;
}
.tab-item.active { color: var(--accent); }
.tab-icon { font-size: 20px; line-height: 1; }

/* ═══ CALENDAR TAB ═══ */
.cal-header {
  display: flex; align-items: center; gap: 8px;
  padding: 16px 16px 8px; flex-shrink: 0;
  position: relative; z-index: 2;
}
.cal-header h2 {
  flex: 1; text-align: center; font-size: 18px;
  font-weight: 600; text-transform: capitalize;
  letter-spacing: -.3px;
}
.nav-btn {
  background: rgba(255,255,255,.06); border: none; color: var(--text);
  border-radius: 50%; width: 34px; height: 34px; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.nav-btn:active { background: rgba(255,255,255,.12); }
.today-btn {
  background: transparent; border: 1.5px solid var(--accent); color: var(--accent);
  border-radius: 12px; padding: 5px 14px; font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; letter-spacing: .2px;
  transition: all .15s;
}
.today-btn:active { background: var(--glow-accent); }
.weekdays {
  display: grid; grid-template-columns: repeat(7,1fr);
  padding: 4px 10px; text-align: center; flex-shrink: 0;
  position: relative; z-index: 2;
}
.weekdays span { font-size: 11px; color: var(--sub); padding: 4px 0; font-weight: 500; letter-spacing: .5px; }
.grid {
  display: grid; grid-template-columns: repeat(7,1fr);
  padding: 0 10px; flex-shrink: 0;
  position: relative; z-index: 2;
}
.day {
  display: flex; flex-direction: column; align-items: center;
  padding: 5px 2px; cursor: pointer; border-radius: 12px; min-height: 46px;
  transition: background .12s;
}
.day:active { background: rgba(255,255,255,.06); }
.day.other-month .day-num { color: var(--dim); }
.day.today .day-num {
  background: var(--accent); color: #000; border-radius: 50%;
  width: 30px; height: 30px; display: flex; align-items: center;
  justify-content: center; font-weight: 700;
  box-shadow: 0 0 16px var(--glow-accent);
}
.day.selected:not(.today) .day-num {
  background: rgba(255,255,255,.08); border-radius: 50%;
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
}
.day-num { font-size: 14px; min-width: 30px; text-align: center; line-height: 30px; font-weight: 400; }
.dots { display: flex; gap: 3px; justify-content: center; max-width: 26px; margin-top: 2px; }
.dot { width: 4px; height: 4px; border-radius: 50%; }
.dot.calendar { background: rgba(255,255,255,.4); }
.dot.erman { background: var(--accent); box-shadow: 0 0 6px var(--glow-accent); }
.dot.overdue { background: var(--danger); }
.divider { height: 1px; background: rgba(255,255,255,.04); margin: 8px 16px; flex-shrink: 0; }

.events-area { flex: 1; overflow-y: auto; padding: 8px 16px 16px; position: relative; z-index: 2; }
.events-date {
  font-size: 11px; color: var(--sub); font-weight: 600;
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px;
}
.event-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.04);
}
.event-item:last-child { border-bottom: none; }
.event-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
}
.event-content { flex: 1; min-width: 0; }
.event-title { font-size: 14px; font-weight: 500; letter-spacing: -.1px; }
.event-time { font-size: 11px; color: var(--sub); margin-top: 3px; }
.event-plan { font-size: 11px; color: var(--accent); margin-top: 3px; }
.no-events { color: var(--sub); font-size: 13px; padding: 16px 0; text-align: center; }

/* Empty state */
.empty-state {
  display: none; flex-direction: column; align-items: center;
  padding: 40px 24px; gap: 16px; text-align: center;
}
.empty-state.show { display: flex; }
.empty-state p { font-size: 14px; color: var(--sub); line-height: 1.6; font-weight: 300; }
.empty-state .hint { font-size: 12px; color: var(--dim); margin-top: 4px; }
.action-btn {
  background: var(--accent); color: #000; font-weight: 700; border: none;
  border-radius: 14px; padding: 13px 28px; font-size: 14px; cursor: pointer;
  letter-spacing: .2px;
  box-shadow: 0 4px 24px var(--glow-accent);
  transition: transform .1s, box-shadow .2s;
}
.action-btn:active { transform: scale(.96); }

/* ═══ FOCUS TAB ═══ */
.focus-wrap {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 24px 24px 16px; overflow-y: auto;
  position: relative; z-index: 2;
}

/* Timer ring — glowing */
.timer-container {
  position: relative; width: 220px; height: 220px; margin-bottom: 28px;
}
.timer-ring-bg, .timer-ring-fg {
  position: absolute; inset: 0;
}
.timer-ring-bg circle {
  fill: none; stroke: rgba(255,255,255,.04); stroke-width: 4;
}
.timer-ring-fg circle {
  fill: none; stroke: url(#timerGrad); stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 597.34; /* 2*PI*95 */
  stroke-dashoffset: 0;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset 1s linear;
  filter: drop-shadow(0 0 12px var(--glow-accent));
}
.timer-ring-fg.done circle {
  stroke: var(--green);
  filter: drop-shadow(0 0 16px rgba(52,211,153,.4));
}
.timer-ring-fg.cancelled circle {
  stroke: var(--danger);
  filter: drop-shadow(0 0 12px rgba(255,69,58,.3));
}
.timer-text {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.timer-digits {
  font-size: 52px; font-weight: 200; font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,.6));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.timer-label {
  font-size: 12px; color: var(--sub); margin-top: 4px;
  font-weight: 400; letter-spacing: .5px;
}

/* Crystal — glowing gem */
.crystal-area {
  width: 64px; height: 64px; margin-bottom: 24px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.crystal {
  font-size: 40px; opacity: 0.15; transform: scale(0.4);
  transition: all .8s cubic-bezier(.34,1.56,.64,1);
  filter: brightness(0.4) saturate(0.3);
}
.crystal.growing {
  animation: crystalGrow var(--grow-dur, 1500s) linear forwards;
}
@keyframes crystalGrow {
  0%   { opacity: 0.2; transform: scale(0.35); filter: brightness(0.4) saturate(0.3); }
  30%  { opacity: 0.5; transform: scale(0.55); filter: brightness(0.7) saturate(0.6); }
  70%  { opacity: 0.8; transform: scale(0.8); filter: brightness(1.0) saturate(0.9); }
  100% { opacity: 1.0; transform: scale(1.0); filter: brightness(1.3) saturate(1.2) drop-shadow(0 0 20px var(--glow-accent)); }
}
.crystal.done {
  opacity: 1; transform: scale(1.15);
  filter: brightness(1.4) saturate(1.3) drop-shadow(0 0 24px var(--glow-accent));
  animation: crystalFloat 2s ease-in-out infinite alternate;
}
@keyframes crystalFloat {
  0% { transform: scale(1.1) translateY(0); }
  100% { transform: scale(1.15) translateY(-4px); }
}
.crystal.shatter {
  animation: crystalShatter .6s ease-out forwards;
}
@keyframes crystalShatter {
  0%  { transform: scale(1); opacity: 0.8; }
  20% { transform: scale(1.1) rotate(5deg); }
  40% { transform: scale(0.7) rotate(-4deg); opacity: 0.5; filter: brightness(2) saturate(0); }
  100% { transform: scale(0) rotate(20deg); opacity: 0; }
}

/* Duration chips */
.duration-row { display: flex; gap: 8px; margin-bottom: 20px; }
.dur-chip {
  padding: 7px 18px; border-radius: 20px;
  font-size: 13px; font-weight: 500; border: 1.5px solid rgba(255,255,255,.08);
  background: transparent; color: var(--sub); cursor: pointer;
  letter-spacing: .2px; transition: all .2s;
}
.dur-chip.active {
  border-color: var(--accent); color: var(--accent);
  background: rgba(255,159,10,.08);
  box-shadow: 0 0 12px rgba(255,159,10,.1);
}

/* Focus button */
.focus-btn {
  width: 100%; max-width: 280px; padding: 16px; border: none; border-radius: 18px;
  font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: .3px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all .15s;
}
.focus-btn.start {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #000;
  box-shadow: 0 4px 28px var(--glow-accent), 0 0 0 1px rgba(255,159,10,.1);
}
.focus-btn.start:active { transform: scale(0.97); box-shadow: 0 2px 16px var(--glow-accent); }
.focus-btn.stop {
  background: rgba(255,255,255,.06); color: var(--danger);
  border: 1px solid rgba(255,69,58,.2);
}
.focus-btn.stop:active { background: rgba(255,69,58,.08); }

/* Stats */
.focus-stats {
  display: flex; gap: 28px; margin-top: 28px; margin-bottom: 20px;
}
.focus-stat {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.focus-stat .val {
  font-size: 24px; font-weight: 300;
  background: linear-gradient(180deg, #fff, rgba(255,255,255,.6));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.focus-stat .lbl { font-size: 10px; color: var(--sub); text-transform: uppercase; letter-spacing: .8px; }

/* Level bar */
.level-bar { width: 100%; max-width: 260px; margin-bottom: 20px; }
.level-info {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; margin-bottom: 8px;
}
.level-name { font-weight: 500; color: var(--text); }
.level-next { color: var(--sub); font-weight: 300; }
.level-track {
  height: 4px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden;
}
.level-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px; transition: width .5s ease;
  box-shadow: 0 0 8px var(--glow-accent);
}

/* Collection mini */
.collection-row {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  max-width: 280px; margin-bottom: 20px; max-height: 50px; overflow: hidden;
}
.collection-row .mini-crystal { font-size: 14px; opacity: 0.7; }

/* ═══ CONFETTI ═══ */
#confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="app">
  <div class="tab-content">

    <!-- ═══ CALENDAR ═══ -->
    <div class="tab-pane active" id="tab-calendar">
      <div class="cal-header">
        <button class="nav-btn" onclick="prevMonth()">&#8249;</button>
        <h2 id="month-label"></h2>
        <button class="nav-btn" onclick="nextMonth()">&#8250;</button>
        <button class="today-btn" onclick="goToday()">Сегодня</button>
      </div>
      <div class="weekdays">
        <span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span>
        <span>ПТ</span><span>СБ</span><span>ВС</span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="divider"></div>
      <div class="events-area" id="events-area">
        <div class="empty-state" id="empty-state">
          <p>Напиши Эрману<br><b>«открой календарь»</b></p>
          <button class="action-btn" id="refresh-btn" onclick="goBack()">&#8592; В чат к Эрману</button>
          <div class="hint" id="empty-hint"></div>
        </div>
      </div>
    </div>

    <!-- ═══ FOCUS ═══ -->
    <div class="tab-pane" id="tab-focus">
      <div class="focus-wrap">

        <!-- Timer -->
        <div class="timer-container">
          <svg class="timer-ring-bg" viewBox="0 0 220 220">
            <circle cx="110" cy="110" r="95"/>
          </svg>
          <svg class="timer-ring-fg" id="timer-ring" viewBox="0 0 220 220">
            <defs>
              <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff9f0a"/>
                <stop offset="50%" stop-color="#ff6b00"/>
                <stop offset="100%" stop-color="#38bdf8"/>
              </linearGradient>
            </defs>
            <circle cx="110" cy="110" r="95"/>
          </svg>
          <div class="timer-text">
            <div class="timer-digits" id="timer-digits">25:00</div>
            <div class="timer-label" id="timer-label">READY</div>
          </div>
        </div>

        <!-- Crystal -->
        <div class="crystal-area">
          <div class="crystal" id="crystal">&#x1F48E;</div>
        </div>

        <!-- Duration chips -->
        <div class="duration-row" id="dur-row">
          <button class="dur-chip" data-min="15" onclick="setDuration(15)">15 min</button>
          <button class="dur-chip active" data-min="25" onclick="setDuration(25)">25 min</button>
          <button class="dur-chip" data-min="45" onclick="setDuration(45)">45 min</button>
        </div>

        <!-- Action -->
        <button class="focus-btn start" id="focus-btn" onclick="toggleFocus()">
          Start Focus
        </button>

        <!-- Stats -->
        <div class="focus-stats">
          <div class="focus-stat">
            <div class="val" id="stat-streak">0</div>
            <div class="lbl">Streak</div>
          </div>
          <div class="focus-stat">
            <div class="val" id="stat-crystals">0</div>
            <div class="lbl">Crystals</div>
          </div>
          <div class="focus-stat">
            <div class="val" id="stat-today">0</div>
            <div class="lbl">Today</div>
          </div>
        </div>

        <!-- Level -->
        <div class="level-bar" id="level-bar">
          <div class="level-info">
            <span class="level-name" id="level-name">&#127793; Beginner</span>
            <span class="level-next" id="level-next"></span>
          </div>
          <div class="level-track">
            <div class="level-fill" id="level-fill" style="width:0%"></div>
          </div>
        </div>

        <!-- Mini collection -->
        <div class="collection-row" id="collection-row"></div>
      </div>
    </div>

  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-item active" data-tab="calendar" onclick="switchTab('calendar')">
      <span class="tab-icon">&#128197;</span>
      <span>Calendar</span>
    </button>
    <button class="tab-item" data-tab="focus" onclick="switchTab('focus')">
      <span class="tab-icon">&#128293;</span>
      <span>Focus</span>
    </button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
// ══════════════════════════════════════════════════════════════════════
// PARTICLES — cosmic dust background
// ══════════════════════════════════════════════════════════════════════
(function initParticles() {
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  let W, H, pts = [];
  const COUNT = 60;

  function resize() {
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < COUNT; i++) {
    pts.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      alpha: Math.random() * 0.4 + 0.1,
      pulse: Math.random() * Math.PI * 2,
      color: ['255,159,10', '56,189,248', '255,107,0', '255,255,255'][Math.floor(Math.random() * 4)],
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const t = Date.now() * 0.001;
    pts.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
      const a = p.alpha * (0.6 + 0.4 * Math.sin(t * 0.8 + p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${a})`;
      ctx.fill();
      // glow
      if (p.r > 1) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color},${a * 0.15})`;
        ctx.fill();
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ══════════════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════════════
let EVENTS = [], TODAY = new Date().toISOString().slice(0,10), hasData = false;
let FOCUS = { collection: [], streak: 0, total_minutes: 0, today_sessions: 0, level: null };
let initTab = 'calendar';

function loadData() {
  try {
    const hash = window.location.hash.slice(1);
    if (!hash) return;
    const b64 = hash.replace(/-/g,'+').replace(/_/g,'/');
    const pad = b64.length % 4;
    const json = decodeURIComponent(escape(atob(pad ? b64 + '='.repeat(4-pad) : b64)));
    const d = JSON.parse(json);
    EVENTS = d.events || [];
    TODAY  = d.today  || TODAY;
    if (d.focus) FOCUS = { ...FOCUS, ...d.focus };
    if (d.tab) initTab = d.tab;
    hasData = true;
  } catch(e) { console.warn('loadData:', e); }
}

// ══════════════════════════════════════════════════════════════════════
// TELEGRAM
// ══════════════════════════════════════════════════════════════════════
const twa = window.Telegram && window.Telegram.WebApp;
if (twa) { twa.ready(); twa.expand(); }
function canSendData() { return hasData && !!twa; }
function goBack() { if (twa) twa.close(); }

// ══════════════════════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════════════════════
let activeTab = 'calendar';

function switchTab(name) {
  activeTab = name;
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
  const pane = document.getElementById('tab-' + name);
  if (pane) pane.classList.add('active');
  const btn = document.querySelector(`.tab-item[data-tab="${name}"]`);
  if (btn) btn.classList.add('active');
}

// ══════════════════════════════════════════════════════════════════════
// CALENDAR
// ══════════════════════════════════════════════════════════════════════
const MONTHS = ['январь','февраль','март','апрель','май','июнь',
                'июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MSHORT = ['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const DSHORT = ['вс','пн','вт','ср','чт','пт','сб'];
let curY, curM, selDate;

function iso(y,m,d) { return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function evFor(d) { return EVENTS.filter(e => e.date === d); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function initCal() {
  const t = new Date(TODAY + 'T12:00:00');
  curY = t.getFullYear(); curM = t.getMonth(); selDate = TODAY;
  if (!hasData) {
    document.getElementById('empty-state').classList.add('show');
    if (!twa) {
      document.getElementById('empty-hint').textContent = 'Open via Telegram';
    }
  }
  renderCal();
}

function renderCal() {
  document.getElementById('month-label').textContent = MONTHS[curM] + ' ' + curY;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const first = new Date(curY, curM, 1);
  let start = first.getDay(); start = start === 0 ? 6 : start - 1;
  const dim  = new Date(curY, curM+1, 0).getDate();
  const dimp = new Date(curY, curM, 0).getDate();
  for (let i = start-1; i >= 0; i--) {
    const pm = curM===0?11:curM-1, py = curM===0?curY-1:curY;
    grid.appendChild(mkDay(dimp-i, iso(py,pm+1,dimp-i), true));
  }
  for (let d=1; d<=dim; d++) grid.appendChild(mkDay(d, iso(curY,curM+1,d), false));
  const total = start+dim, rem = total%7===0?0:7-(total%7);
  for (let d=1; d<=rem; d++) {
    const nm = curM===11?0:curM+1, ny = curM===11?curY+1:curY;
    grid.appendChild(mkDay(d, iso(ny,nm+1,d), true));
  }
  if (hasData) renderEvents(selDate);
}

function mkDay(num, dateStr, other) {
  const div = document.createElement('div');
  div.className = 'day'+(other?' other-month':'')+(dateStr===TODAY?' today':'')+(dateStr===selDate?' selected':'');
  div.onclick = () => { selDate=dateStr; renderCal(); };
  const n = document.createElement('div'); n.className='day-num'; n.textContent=num;
  div.appendChild(n);
  const evs = evFor(dateStr);
  if (evs.length) {
    const dots = document.createElement('div'); dots.className='dots';
    evs.slice(0,3).forEach(e => {
      const dot = document.createElement('div');
      dot.className = 'dot '+(e.overdue?'overdue':e.source==='erman'?'erman':'calendar');
      dots.appendChild(dot);
    });
    div.appendChild(dots);
  }
  return div;
}

function renderEvents(dateStr) {
  const area = document.getElementById('events-area');
  const evs = evFor(dateStr);
  const d = new Date(dateStr+'T12:00:00');
  const label = DSHORT[d.getDay()]+', '+d.getDate()+' '+MSHORT[d.getMonth()+1];
  let html = `<div class="events-date">${label}</div>`;
  if (!evs.length) {
    html += `<div class="no-events">No events</div>`;
  } else {
    [...evs].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')).forEach(e => {
      const col = e.overdue?'var(--danger)':e.source==='erman'?'var(--accent)':'rgba(255,255,255,.4)';
      html += `<div class="event-item"><div class="event-dot" style="background:${col};${e.source==='erman'?'box-shadow:0 0 6px var(--glow-accent)':''}"></div><div class="event-content"><div class="event-title">${esc(e.title)}</div>${e.time?`<div class="event-time">${e.time}</div>`:''}${e.plan?`<div class="event-plan">${esc(e.plan)}</div>`:''}</div></div>`;
    });
  }
  area.innerHTML = html;
}

function prevMonth() { curM--; if(curM<0){curM=11;curY--;} renderCal(); }
function nextMonth() { curM++; if(curM>11){curM=0;curY++;} renderCal(); }
function goToday() { const t=new Date(TODAY+'T12:00:00'); curY=t.getFullYear(); curM=t.getMonth(); selDate=TODAY; renderCal(); }

// ══════════════════════════════════════════════════════════════════════
// FOCUS / POMODORO
// ══════════════════════════════════════════════════════════════════════
let focusDuration = 25, focusRunning = false, focusTimer = null;
let focusStart = 0, focusElapsed = 0;
const DASH_TOTAL = 597.34; // 2*PI*95

function setDuration(min) {
  if (focusRunning) return;
  focusDuration = min;
  document.querySelectorAll('.dur-chip').forEach(c =>
    c.classList.toggle('active', parseInt(c.dataset.min) === min));
  document.getElementById('timer-digits').textContent = min + ':00';
}

function toggleFocus() {
  if (focusRunning) stopFocus(false); else startFocus();
}

function startFocus() {
  focusRunning = true;
  focusStart = Date.now();
  focusElapsed = 0;
  const totalSec = focusDuration * 60;

  // UI
  document.getElementById('dur-row').style.opacity = '0.3';
  document.getElementById('dur-row').style.pointerEvents = 'none';
  const btn = document.getElementById('focus-btn');
  btn.className = 'focus-btn stop';
  btn.textContent = 'Stop';
  document.getElementById('timer-label').textContent = 'FOCUSING';
  document.getElementById('timer-ring').classList.remove('done','cancelled');

  // Crystal
  const crystal = document.getElementById('crystal');
  crystal.className = 'crystal growing';
  crystal.style.setProperty('--grow-dur', totalSec + 's');

  // Timer tick
  focusTimer = setInterval(() => {
    focusElapsed = Math.floor((Date.now() - focusStart) / 1000);
    const remain = Math.max(0, totalSec - focusElapsed);
    const m = Math.floor(remain / 60), s = remain % 60;
    document.getElementById('timer-digits').textContent =
      String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    const pct = focusElapsed / totalSec;
    document.querySelector('#timer-ring circle').style.strokeDashoffset =
      Math.max(0, DASH_TOTAL * (1 - pct));
    if (remain <= 0) stopFocus(true);
  }, 1000);
}

function stopFocus(completed) {
  clearInterval(focusTimer);
  focusRunning = false;
  document.getElementById('dur-row').style.opacity = '';
  document.getElementById('dur-row').style.pointerEvents = '';
  const btn = document.getElementById('focus-btn');
  btn.className = 'focus-btn start';
  btn.textContent = 'Start Focus';
  const crystal = document.getElementById('crystal');
  const ring = document.getElementById('timer-ring');

  if (completed) {
    crystal.className = 'crystal done';
    ring.classList.add('done');
    document.getElementById('timer-label').textContent = 'COMPLETE';
    document.getElementById('timer-digits').textContent = '00:00';
    celebrate();
    FOCUS.today_sessions = (FOCUS.today_sessions || 0) + 1;
    FOCUS.total_minutes = (FOCUS.total_minutes || 0) + focusDuration;
    FOCUS.collection.push({ type: 'amber', date: TODAY, duration: focusDuration });
    renderFocusStats();
    if (twa) { try { twa.sendData(JSON.stringify({ type: 'focus_complete', duration: focusDuration })); } catch(e) {} }
    setTimeout(resetTimer, 3500);
  } else {
    crystal.className = 'crystal shatter';
    ring.classList.add('cancelled');
    document.getElementById('timer-label').textContent = 'CANCELLED';
    if (twa && focusElapsed > 60) { try { twa.sendData(JSON.stringify({ type: 'focus_cancel', elapsed_seconds: focusElapsed })); } catch(e) {} }
    setTimeout(resetTimer, 1500);
  }
}

function resetTimer() {
  const crystal = document.getElementById('crystal');
  crystal.className = 'crystal';
  crystal.style.removeProperty('--grow-dur');
  const ring = document.getElementById('timer-ring');
  ring.classList.remove('done','cancelled');
  document.getElementById('timer-label').textContent = 'READY';
  document.getElementById('timer-digits').textContent = focusDuration + ':00';
  document.querySelector('#timer-ring circle').style.strokeDashoffset = 0;
}

function renderFocusStats() {
  document.getElementById('stat-streak').textContent = FOCUS.streak || 0;
  document.getElementById('stat-crystals').textContent = (FOCUS.collection || []).length;
  document.getElementById('stat-today').textContent = FOCUS.today_sessions || 0;
  const lvl = FOCUS.level;
  if (lvl) {
    document.getElementById('level-name').textContent = (lvl.emoji||'') + ' ' + (lvl.name||'');
    if (lvl.next_name) document.getElementById('level-next').textContent = lvl.next_emoji + ' ' + lvl.next_name;
    document.getElementById('level-fill').style.width = (lvl.progress || 0) + '%';
  }
  const crystalEmojis = { amber: '🔶', sapphire: '💎', prismatic: '🌈', emerald: '💚' };
  document.getElementById('collection-row').innerHTML = (FOCUS.collection || []).slice(-20).map(c =>
    `<span class="mini-crystal">${crystalEmojis[c.type] || '💎'}</span>`
  ).join('');
}

// ══════════════════════════════════════════════════════════════════════
// CONFETTI — celebration particles
// ══════════════════════════════════════════════════════════════════════
function celebrate() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const colors = ['#ff9f0a','#ff6b00','#38bdf8','#22d3ee','#34d399','#ffd60a'];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 80,
      y: canvas.height * 0.4,
      vx: (Math.random() - 0.5) * 14,
      vy: -Math.random() * 16 - 3,
      size: Math.random() * 5 + 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1, rot: Math.random() * 360, rotV: (Math.random() - 0.5) * 12,
    });
  }
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx; p.vy += 0.28; p.y += p.vy;
      p.life -= 0.012; p.rot += p.rotV;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      // mixed shapes: circles + rectangles
      if (p.size > 4) {
        ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      } else {
        ctx.beginPath(); ctx.arc(0, 0, p.size/2, 0, Math.PI*2); ctx.fill();
      }
      // glow
      ctx.globalAlpha = Math.max(0, p.life * 0.3);
      ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      ctx.fillRect(-1, -1, 2, 2);
      ctx.restore();
    });
    if (alive && frame < 150) { frame++; requestAnimationFrame(draw); }
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(draw);
}
